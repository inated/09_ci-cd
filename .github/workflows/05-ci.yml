name: 05 - CI

on: 
    push:
        branches: [main]
    pull_request: 
        branches: [main]
    
jobs:
    ci:
        runs-on: ubuntu-24.04

        defaults:
            run:
                working-directory: 09_ci-cd
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Preparar pnpm
              uses: pnpm/action-setup@v6
              with:
                version: 11
                run install: true

            - name: Instalar dependencias
              run: pnpm install

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build
              

